name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts
      - run: python -m pytest -q
      - run: python -m ruff check app tests scripts

  milvus-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: docker compose -f docker-compose.milvus.yml -f .github/docker-compose.milvus-ci.yml up -d --wait --wait-timeout 240
      - run: python -m pytest tests/integration/test_milvus_sync.py -q
        env:
          RUN_MILVUS_INTEGRATION: "1"
          MILVUS_URI: http://127.0.0.1:19530
      - if: always()
        run: docker compose -f docker-compose.milvus.yml -f .github/docker-compose.milvus-ci.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.milvus.yml -f .github/docker-compose.milvus-ci.yml down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
